<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Here For You</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf7;
      color: #333;
    }

    header {
      background: #f4d9d0;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
    }

    .contact {
      text-align: center;
      margin-top: 35px;
      padding: 25px;
      background: #f4d9d0;
      border-radius: 15px;
    }

    .contact a {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 22px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>Here For You</h1>
  <p>Fashion • Watches • Mini Fans</p>
</header>

<div class="container">

  <h2>Our Products</h2>

  <div class="products">

    <div class="product">
      <img src="https://via.placeholder.com/400x400?text=Watch" alt="Watch">
      <h3>Fashion Watch</h3>
      <p class="price">Price - Contact Us</p>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/400x400?text=Mini+Fan" alt="Mini Fan">
      <h3>Mini Fan</h3>
      <p class="price">Price - Contact Us</p>
    </div>

  </div>

  <div class="contact">
    <h2>Order Now</h2>
    <p>For orders and enquiries, please contact us.</p>
    <a href="#">Contact Us</a>
  </div>

</div>

</body>
</html>
